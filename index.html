<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohit's Autonomous Job Apply Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#EDF1F3;--surface:#fff;--ink:#101C26;--muted:#556673;--line:#D3DCE2;--accent:#0B5FFF;--accent-ink:#fff;--soft:#E3ECFF;--good:#0E7A4F;--good-soft:#DDF3E8;--warn:#8F5400;--warn-soft:#FBEBCF;--bad:#B3261E;--bad-soft:#FBE1DE;
--fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--fb:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0C141B;--surface:#141F29;--ink:#E6EEF4;--muted:#94A6B4;--line:#25343F;--accent:#5B93FF;--accent-ink:#06142E;--soft:#17294A;--good:#4CC38A;--good-soft:#12301F;--warn:#E6A94B;--warn-soft:#33260F;--bad:#FF8A80;--bad-soft:#3A1916;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--fb);padding:20px 16px 48px}
.wrap{max-width:1000px;margin:auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 clamp(26px,5vw,38px)/1.08 var(--fd);margin:0;letter-spacing:-.02em;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sub{color:var(--muted);margin:6px 0 0;max-width:58ch}
.stats{display:flex;gap:22px}.stat b{display:block;font:600 28px/1 var(--fd)}.stat span{font:500 11px/1.2 var(--fm);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 14px;font:600 14px/1 var(--fb);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.btn.good{background:var(--good);color:#fff}.btn[disabled]{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--fb);padding:11px 14px;cursor:pointer;margin-bottom:-1px}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.job{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center}.job:first-child{border-top:0}
.job .m{min-width:0;flex:1 1 260px}.job b{font-weight:600}.job small{display:block;color:var(--muted)}
.tag{display:inline-block;font:500 11px/1 var(--fm);letter-spacing:.05em;text-transform:uppercase;padding:5px 7px;border-radius:4px;background:var(--soft);color:var(--accent);margin-right:6px}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 32px));padding:20px;max-height:90vh}
dialog::backdrop{background:#0008}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:220px}
.msg{padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Mohit's Autonomous Job Apply Portal</h1>
<p class="sub">Live jobs from open APIs, filtered to remote, hybrid, Noida and Gurgaon, ranked against your resume. Prepare an application in one click, then let the portal fill the real form for you.</p></div>
<div class="stats"><div class="stat"><b id="nJobs">0</b><span>Matches</span></div><div class="stat"><b id="nApplied">0</b><span>Applied</span></div></div></div>
<div class="tabs" role="tablist"><button role="tab" id="tJobs" aria-selected="true">Jobs</button><button role="tab" id="tApps" aria-selected="false">Applied</button></div>
<div id="pJobs"><div class="bar">
<input id="q" type="search" placeholder="Search title or company" aria-label="Search">
<select id="where" aria-label="Location"><option value="">All locations</option><option value="remote">Remote</option><option value="hybrid/onsite NCR">Noida / Gurgaon</option></select>
<button class="btn ghost" id="refresh">Refresh now</button><span id="fetched" style="color:var(--muted);font-size:13px"></span></div>
<div class="list" id="jobs" style="margin-top:12px"></div></div>
<div id="pApps" hidden><div class="list" id="apps"></div></div>
</div>
<dialog id="dlg"><h2 id="dTitle" style="margin:0 0 4px;font:700 20px var(--fd)"></h2><div id="dMeta" style="color:var(--muted);margin-bottom:10px"></div>
<div id="dBody"></div>
<div class="row"><button class="btn ghost" id="dClose">Close</button><div class="acts">
<button class="btn ghost" id="dCopy">Copy note</button>
<button class="btn ghost" id="dOpen">Open job page</button>
<button class="btn" id="dAssist">Fill the form for me</button>
<button class="btn good" id="dLog">I submitted it</button></div></div></dialog>
<script>
const $=id=>document.getElementById(id);let cur=null,note="";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function loadJobs(refresh){
  $("jobs").innerHTML='<div class="empty">Fetching jobs from the open APIs. The first load takes up to a minute.</div>';
  try{const d=await api(`/api/jobs?q=${encodeURIComponent($("q").value)}&where=${encodeURIComponent($("where").value)}${refresh?"&refresh=1":""}`);
    $("nJobs").textContent=d.total;$("fetched").textContent=d.fetched?"Updated "+new Date(d.fetched*1000).toLocaleTimeString():"";
    window._jobs=d.jobs;
    $("jobs").innerHTML=d.jobs.length?d.jobs.map((j,i)=>`<div class="job"><div class="m"><b>${esc(j.title)}</b> <small>${esc(j.company)} · ${esc(j.location||"n/a")}${j.salary?" · "+esc(j.salary):""}</small>
    <span class="tag ${j.where==="remote"?"good":"warn"}">${j.where==="remote"?"Remote":"Noida / Gurgaon"}</span><span class="tag">match ${j.score}</span><span class="tag">${esc(j.source)}</span>${j.applied?'<span class="tag good">applied</span>':""}</div>
    <div class="acts"><button class="btn" data-i="${i}">Prepare &amp; apply</button></div></div>`).join(""):'<div class="empty">No matches right now. Try Refresh in a while.</div>';
  }catch(e){$("jobs").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function loadApps(){const d=await api("/api/apps");$("nApplied").textContent=d.length;
  $("apps").innerHTML=d.length?d.map(a=>`<div class="job"><div class="m"><b>${esc(a.title)}</b><small>${esc(a.company)} · ${esc(a.source)} · ${new Date(a.ts*1000).toLocaleDateString()}</small></div><a class="btn ghost" href="${esc(a.url)}" target="_blank" rel="noopener">Open</a></div>`).join(""):'<div class="empty">Nothing logged yet. Press "I submitted it" after you apply.</div>'}
$("jobs").addEventListener("click",async e=>{const b=e.target.closest("button[data-i]");if(!b)return;
  cur=window._jobs[b.dataset.i];$("dTitle").textContent=cur.title;$("dMeta").textContent=`${cur.company} · ${cur.location||""}`;
  $("dBody").innerHTML='<p>Preparing your application…</p>';$("dlg").showModal();
  try{const d=await api("/api/prepare",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:cur.id})});
    note=d.cover_note;$("dBody").innerHTML=(d.match_percent!=null?`<p><span class="tag ${d.match_percent>=70?"good":"warn"}">${d.match_percent}% match</span> ${d.mode==="ai"?"":""}</p>`:"")+
    (d.matched?.length?`<p>${d.matched.map(s=>`<span class="tag good">${esc(s)}</span>`).join("")}</p>`:"")+
    (d.gaps?.length?`<p style="color:var(--muted)">Gaps: ${d.gaps.map(esc).join("; ")}</p>`:"")+
    `<textarea id="noteBox" aria-label="Cover note">${esc(note)}</textarea>`+
    (d.mode==="template"?'<p style="color:var(--muted);font-size:13px">Template note. Set ANTHROPIC_API_KEY on the server for notes written per job.</p>':"")
  }catch(err){$("dBody").innerHTML=`<div class="msg">${esc(err.message)}</div>`}});
$("dClose").onclick=()=>$("dlg").close();
$("dOpen").onclick=()=>window.open(cur.url,"_blank","noopener");
$("dCopy").onclick=async()=>{const t=$("noteBox")?.value||"";try{await navigator.clipboard.writeText(t);$("dCopy").textContent="Copied"}catch{$("noteBox").select()}setTimeout(()=>$("dCopy").textContent="Copy note",1500)};
$("dAssist").onclick=async()=>{$("dAssist").disabled=true;try{const d=await api("/api/assist",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:cur.id,cover_note:$("noteBox")?.value})});$("dBody").insertAdjacentHTML("afterbegin",`<div class="msg">${esc(d.message)}</div>`)}catch(e){$("dBody").insertAdjacentHTML("afterbegin",`<div class="msg">${esc(e.message)} Use "Open job page" and paste the note instead.</div>`)}$("dAssist").disabled=false};
$("dLog").onclick=async()=>{await api("/api/log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:cur.id,title:cur.title,company:cur.company,url:cur.url,source:cur.source})});$("dlg").close();loadJobs();loadApps()};
$("refresh").onclick=()=>loadJobs(true);$("q").oninput=debounce(()=>loadJobs(),350);$("where").onchange=()=>loadJobs();
function debounce(f,ms){let t;return()=>{clearTimeout(t);t=setTimeout(f,ms)}}
$("tJobs").onclick=()=>{$("pJobs").hidden=false;$("pApps").hidden=true;$("tJobs").setAttribute("aria-selected","true");$("tApps").setAttribute("aria-selected","false")};
$("tApps").onclick=()=>{$("pJobs").hidden=true;$("pApps").hidden=false;$("tApps").setAttribute("aria-selected","true");$("tJobs").setAttribute("aria-selected","false");loadApps()};
loadJobs();loadApps();
</script></body></html>
